# Mak's OJ — Docker Compose (development reference)
#
# This is a reference configuration for local development.
# For production, adjust resource limits, add health checks, and use secrets management.
#
# Usage:
#   1. Copy .env.example to backend/.env and fill in your values
#   2. docker compose up -d
#
# Services:
#   - db:          PostgreSQL 14
#   - redis:       Redis 7
#   - backend:     FastAPI application
#   - worker:      Celery judge worker
#   - judge-core:  go-judge sandbox (C++ compilation & execution)
#   - nginx:       Reverse proxy (serves frontend + proxies API)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oj_db}
      POSTGRES_USER: ${POSTGRES_USER:-oj_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    command: celery -A celery_app.celery worker --loglevel=info --concurrency=2
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
      - judge-core

  judge-core:
    image: looggai/judge-core:latest
    restart: unless-stopped
    privileged: true
    ports:
      - "5050:5050"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  pgdata:
